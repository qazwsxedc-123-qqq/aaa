<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在更新</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b5cad;color:#fff;
 font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
 -webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
 gap:18px;padding:24px;text-align:center}
.spin{display:flex;gap:7px;margin-bottom:6px}
.spin i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.35;animation:dot 1.4s infinite}
.spin i:nth-child(2){animation-delay:.18s}
.spin i:nth-child(3){animation-delay:.36s}
.spin i:nth-child(4){animation-delay:.54s}
.spin i:nth-child(5){animation-delay:.72s}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
h1{margin:0;font-size:clamp(26px,5vw,48px);font-weight:300;letter-spacing:.5px}
h1 b{font-weight:600;font-variant-numeric:tabular-nums}
.sub{font-size:clamp(13px,1.8vw,17px);opacity:.92}
.eta{font-size:clamp(12px,1.6vw,15px);opacity:.65}
.hint{position:fixed;right:14px;bottom:10px;font-size:11px;opacity:.2}
#done{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;gap:16px;
 background:radial-gradient(circle at 50% 35%,#14303f,#06090c);text-align:center;padding:24px}
#done.on{display:flex}
#done .e{font-size:clamp(60px,13vw,116px);animation:bb 1.2s infinite}
@keyframes bb{50%{transform:translateY(-12px) rotate(-8deg)}}
#done h2{margin:0;font-size:clamp(20px,3.6vw,32px)}
#done p{margin:0;color:#8b949e;line-height:1.9;font-size:clamp(13px,1.8vw,16px)}
#done a{color:#7ee787;text-decoration:none}
</style>
</head>
<body>
<div id="wrap">
  <div class="spin"><i></i><i></i><i></i><i></i><i></i></div>
  <h1><b id="pct">0</b>% 已完成</h1>
  <div class="sub" id="msg">正在安装更新，请不要关闭计算机</div>
  <div class="eta" id="eta">剩余时间约 23 分钟</div>
</div>
<div id="done">
  <div class="e">😏</div>
  <h2>更新完成？想多了</h2>
  <p>整个过程其实只用了十几秒。<br>你的电脑非常好，一根汗毛都没动。<br><a href="index.html">← 回到恶搞合集</a></p>
</div>
<div class="hint">Esc 退出</div>
<script>
(function(){
  var pct=document.getElementById('pct'),msg=document.getElementById('msg'),eta=document.getElementById('eta');
  var v=0, rolled=false;
  function tick(){
    var sp = v<12 ? 4 : (v<55 ? 2.4 : (v<78 ? 1.4 : 2.2));
    v+=Math.random()*sp;
    if(!rolled && v>70 && v<78 && Math.random()<0.4){
      rolled=true; v-=7;
      msg.textContent='正在回滚更改…';
      setTimeout(function(){ msg.textContent='正在重新尝试安装'; },2200);
    }
    if(v>=100){
      pct.textContent='100';
      eta.textContent='剩余时间约 1 分钟';
      msg.textContent='即将完成，请稍候…';
      setTimeout(function(){ document.getElementById('done').classList.add('on'); },1600);
      return;
    }
    var i=Math.floor(v);
    pct.textContent=i;
    eta.textContent='剩余时间约 '+Math.max(1,Math.round((100-i)*0.22))+' 分钟';
    setTimeout(tick, 110+Math.random()*260);
  }
  setTimeout(tick,700);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') location.href='index.html'; });
})();
</script>
</body>
</html>
